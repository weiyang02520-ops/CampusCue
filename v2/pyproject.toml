[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campuscue-v2"
version = "0.1.0"
description = "CampusCue V2 - independent campus affairs AI agent platform"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12,<17",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["campuscue", "campuscue.app", "campuscue.core", "campuscue.handlers", "campuscue.adapters", "campuscue.adapters.onebot", "campuscue.storage", "campuscue.repositories", "campuscue.services", "campuscue.providers", "campuscue.tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
