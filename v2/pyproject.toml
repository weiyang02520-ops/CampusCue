[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campuscue-v2"
version = "0.1.0"
description = "CampusCue V2 - independent campus affairs agent runtime (M1: QQ runtime)"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12,<17",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["campuscue", "campuscue.app", "campuscue.core", "campuscue.handlers", "campuscue.adapters", "campuscue.adapters.onebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
